server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # endpoint de salud para healthchecks y blackbox_exporter (§10)
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # el backend se resuelve por DNS interno de Docker, nunca por localhost
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # SPA: cualquier ruta desconocida vuelve a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # cache de assets con hash
  location ~* \.(js|css|woff2|png|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
