# §14: zona de límite de peticiones (contexto http, fuera del server)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # §14: no revelar la versión de nginx
  server_tokens off;

  # §14: cabeceras de seguridad (archivo común)
  include /etc/nginx/snippets/security-headers.conf;

  # endpoint de salud para healthchecks y blackbox_exporter (§10)
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # salud del backend: la usa el deploy (§8) y el sondeo externo (§9)
  location = /health {
    proxy_pass http://backend:3000/health;
    access_log off;
  }

  # el backend se resuelve por DNS interno de Docker, nunca por localhost
  location /api/ {
    # §14: límite de peticiones por IP (mitiga fuerza bruta y scraping)
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # SPA: cualquier ruta desconocida vuelve a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # cache de assets con hash
  location ~* \.(js|css|woff2|png|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    # un add_header en el location descarta los heredados: se re-incluyen
    include /etc/nginx/snippets/security-headers.conf;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
