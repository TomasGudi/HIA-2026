# ============================================================
# Práctica Integradora Final — stack de servicios
# Sprint 1: base de datos + cliente de administración
# Sprint 2+: backend, frontend, monitoreo y ops (se agregan abajo)
#
# Reglas de diseño (ver docs/05-decisiones.md):
#  - La base de datos NUNCA se publica fuera de loopback.
#  - Las redes dbnet/appnet son internas: sin salida a Internet.
#  - Credenciales solo por variables de entorno.
# ============================================================
name: practica-integradora

services:
  db:
    image: postgres:16.4-alpine
    container_name: pi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # parámetros del motor (§5): se ajustan y se miden, no se copian de un blog
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # necesarias para que db/init/04-mantis-db.sh cree la base de §11
      MANTIS_DB_NAME: ${MANTIS_DB_NAME:-mantis}
      MANTIS_DB_USER: ${MANTIS_DB_USER:-mantis}
      MANTIS_DB_PASSWORD: ${MANTIS_DB_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=off
    ports:
      # loopback únicamente: accesible desde la máquina anfitriona, no desde la red
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # se ejecuta solo cuando el volumen está vacío (primer arranque)
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
      # destino de los backups (§4). Fuera del repo por .gitignore.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dbnet
    shm_size: 1gb

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pi-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # consola de administración: solo loopback. En producción se llega por túnel/VPN.
      - "127.0.0.1:8080:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - dbnet

  # ---------------------------------------------------------------
  # Mantis Bug Tracker (§11). Perfil "ops": no arranca con el stack
  # principal, para no competir por recursos durante la demo de la app.
  #   docker compose --profile ops up -d mantis
  # ---------------------------------------------------------------
  mantis:
    build:
      context: ./app/mantis
      args:
        MANTIS_VERSION: 2.28.4
    image: pi-mantis:2.28.4
    container_name: pi-mantis
    restart: unless-stopped
    profiles: ["ops"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MANTIS_DB_HOST: db
      MANTIS_DB_NAME: ${MANTIS_DB_NAME:-mantis}
      MANTIS_DB_USER: ${MANTIS_DB_USER:-mantis}
      MANTIS_DB_PASSWORD: ${MANTIS_DB_PASSWORD}
      MANTIS_CRYPTO_SALT: ${MANTIS_CRYPTO_SALT}
    ports:
      # solo loopback: en producción se llega por túnel con auth (§9)
      - "127.0.0.1:8081:80"
    volumes:
      # adjuntos de las incidencias: sin volumen, un `down` borra la evidencia de §11
      - mantis_files:/var/www/html/files
    networks:
      - dbnet

  # ---------------------------------------------------------------
  # Aplicación (§7): backend y frontend en contenedores separados,
  # comunicados por la red interna appnet. Solo el frontend publica
  # puerto, y en loopback: en producción se llega por túnel (§9).
  # ---------------------------------------------------------------
  backend:
    build:
      context: ./app/backend
    image: pi-backend:dev
    container_name: pi-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # dentro de la red Docker el puerto de la DB es 5432 (no el 5433 del host)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3000"
    networks:
      - appnet
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./app/frontend
    image: pi-frontend:dev
    container_name: pi-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # solo loopback; la publicación real es por túnel (§9)
      - "127.0.0.1:8090:80"
    networks:
      - appnet

volumes:
  pgdata:
    name: pi-pgdata
  pgadmin:
    name: pi-pgadmin
  mantis_files:
    name: pi-mantis-files

networks:
  appnet:
    name: pi-appnet
    driver: bridge
  dbnet:
    name: pi-dbnet
    driver: bridge
    # NOTA: no usar internal: true — Docker no publica puertos de contenedores
    # conectados solo a una red interna (el binding se descarta sin error).
    # El aislamiento se logra así: la DB solo se publica en 127.0.0.1 y en
    # producción no se publica ningún puerto de db/pgadmin (se llega por túnel).
