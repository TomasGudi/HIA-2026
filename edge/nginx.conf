# ============================================================
# Borde de administración (§9)
#
# Publica pgAdmin y Mantis detrás de HTTP Basic + el túnel de
# Cloudflare (que aporta HTTPS). No reemplaza el login propio de
# cada herramienta: lo antepone.
#
#   :8080 -> pgAdmin
#   :8081 -> Mantis
#
# Los puertos se publican solo en loopback; el acceso externo va
# por el túnel.
# ============================================================

server {
  listen 8080;
  server_name _;

  auth_basic           "Administracion - Practica Integradora";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # pgAdmin es una SPA: necesita los headers de proxy y no cachear
  location / {
    proxy_pass         http://pgadmin:80;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   X-Script-Name     /;
    proxy_read_timeout 120s;
  }
}

server {
  listen 8081;
  server_name _;

  auth_basic           "Administracion - Practica Integradora";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location / {
    proxy_pass         http://mantis:80;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}

server {
  listen 8082;
  server_name _;

  auth_basic           "Administracion - Practica Integradora";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # n8n: la UI no tiene auth propia configurada, así que la barrera es el borde
  location / {
    proxy_pass         http://n8n:5678;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    # n8n usa websockets para el editor
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_read_timeout 300s;
  }
}
