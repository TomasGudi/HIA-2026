name: Release

# Publica las imágenes en GHCR cuando algo llega a `main` (§8).
#
# No se dispara en PRs: construir y publicar en cada PR llenaría el
# registro de imágenes que nadie va a desplegar. La protección de rama
# garantiza que a `main` solo llega código con los 4 checks de CI en verde.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # único permiso de escritura del pipeline

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: build-push-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./app/backend
          - service: frontend
            context: ./app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR exige nombre en minúsculas: no se usa github.repository_owner
          # porque el dueño es `TomasGudi` y el push fallaría
          images: ghcr.io/tomasgudi/hia-2026-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=HIA-2026 ${{ matrix.service }}
            org.opencontainers.image.description=Práctica Integradora Final 2026

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Resumen
        run: |
          echo "### ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
